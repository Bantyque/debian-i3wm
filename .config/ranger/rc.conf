# ===================================================================
# == Options
# ===================================================================

set viewmode miller
set column_ratios 1,3,4

# Скрытые файлы - показываем, переключение по zh
set show_hidden true
set hidden_filter ^\.|\.(?:pyc|pyo|bak|swp)$|^lost\+found$|^__(py)?cache__$

# Подтверждение удаления
set confirm_on_delete multiple

# Предпросмотр
set use_preview_script true
set preview_script ~/.config/ranger/scope.sh
set preview_images true
set preview_images_method ueberzug
set preview_files true
set preview_directories true

# Иконки (ranger_devicons)
default_linemode devicons

# Интерфейс
set draw_borders separators
set draw_progress_bar_in_status_bar true
set display_size_in_main_column true
set display_size_in_status_bar true
set display_free_space_in_status_bar true
set display_tags_in_all_columns true
set update_title true
set update_tmux_title true
set shorten_title 3
set hostname_in_titlebar true
set tilde_in_titlebar true

# Сортировка
set sort natural
set sort_reverse false
set sort_case_insensitive true
set sort_directories_first true

# Мышь
set mouse_enabled true

# Unicode
set unicode_ellipsis true
set show_cursor false

# Вкладки
set save_tabs_on_exit false
set open_all_images true

# Цвета из pywal
set colorscheme default

# ===================================================================
# == Горячие клавиши
# ===================================================================

# --- Основные ---
map Q quit!
map q quit
map R reload_cwd
map <C-r> reset
map <C-l> redraw_window

# --- Движение ---
map j move down=1
map k move up=1
map h move left=1
map l move right=1
map J move down=5
map K move up=5
map gg move to=0
map G move to=-1
map <C-d> move down=15
map <C-u> move up=15

# --- Открытие ---
map <Enter> open
map o open_with

# --- Копирование/перемещение ---
map yy copy
map dd cut
map pp paste
map po paste overwrite=True
map dD console delete
map ya copy mode=add
map yr copy mode=remove
map yt copy mode=toggle

# --- Выделение ---
map <Space> mark_files toggle=True
map v mark_files all=True toggle=True
map V toggle_visual_mode
map uv mark_files all=True val=False

# --- Переименование ---
map cw console rename
map a  console rename%space
map A  rename_append
map I  rename_prepend

# --- Новая папка/файл ---
map md console mkdir%space
map mf console touch%space

# --- Вкладки ---
map <C-n> tab_new
map <C-w> tab_close
map <Tab> tab_move 1
map <S-Tab> tab_move -1
map 1 tab_open 1
map 2 tab_open 2
map 3 tab_open 3
map 4 tab_open 4

# --- Поиск ---
map f console scout -ftsea%space
map F console scout -ftsea%space
map / console search%space
map n search_next
map N search_next forward=False

# --- Скрытые файлы ---
map zh set show_hidden!

# --- Сортировка ---
map os chain set sort=size;     set sort_reverse=False
map oS chain set sort=size;     set sort_reverse=True
map on chain set sort=natural;  set sort_reverse=False
map oN chain set sort=natural;  set sort_reverse=True
map om chain set sort=mtime;    set sort_reverse=False
map oM chain set sort=mtime;    set sort_reverse=True
map oe chain set sort=extension; set sort_reverse=False
map oE chain set sort=extension; set sort_reverse=True

# --- Drag & Drop (требует dragon) ---
map <C-d> shell dragon -a -x %p
map <C-t> shell dragon -a -x %s

# --- Быстрые переходы ---
map gh cd ~
map gd cd ~/Документы
map gD cd /data
map gp cd ~/Изображения
map gv cd ~/Видео
map gc cd ~/.config
map gr cd /

# --- Терминал в текущей папке ---
map <C-e> shell urxvt &
map S shell $SHELL

# --- Предпросмотр ---
map zp toggle_option preview_files
map zP toggle_option preview_directories
map zi toggle_option preview_images

# --- Размер колонок ---
map + set column_ratios 1,3,6
map - set column_ratios 1,3,4
map = set column_ratios 1,1,1

# ===================================================================
# == Ассоциации открытия файлов
# ===================================================================

# Изображения
map <C-v> shell nsxiv %f &

# Видео
map <C-m> shell mpv %f &

# Текстовые файлы в nvim
map e shell nvim %f
